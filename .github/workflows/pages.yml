name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 패키지 설치
        run: pip install -r backend/requirements.txt
      - name: 계산 모듈 테스트
        run: cd backend && python -m pytest -q
      - name: 시장 원자료 수집
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python backend/scripts/fetch_raw.py
      - name: 사이트 빌드
        run: bash scripts/build_pages.sh
      - name: 정적 파일 브랜치(dist) 갱신
        run: |
          rm -rf /tmp/dist && cp -r site /tmp/dist && cd /tmp/dist
          git init -q -b dist
          git config user.name "kjhoeakjy"
          git config user.email "kjhoeakjy@users.noreply.github.com"
          git add -A && git commit -qm "배포 파일 갱신"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
